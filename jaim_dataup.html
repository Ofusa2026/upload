<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #1341a8;
    --success: #057a55;
    --success-bg: #f0fdf4;
    --success-border: #bbf7d0;
    --error: #9b1c1c;
    --error-bg: #fef2f2;
    --error-border: #fecaca;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px 16px 60px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 28px 20px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);

  .header { text-align: center; margin-bottom: 24px; }
  .office-name { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  .page-icon { font-size: 36px; margin-bottom: 8px; }
  h1 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--sub); line-height: 1.7; }
  .company-name-bar {
    background: #eff6ff;
    border: 1.5px solid #bfdbfe;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 20px;
    text-align: center;

    background: #eef2f7;
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 20px;
    gap: 4px;

  .tab-btn {
    flex: 1;
    padding: 11px 6px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--sub);
    cursor: pointer;
    transition: all 0.18s;

    background: var(--card);
    color: var(--primary);

  .tab-btn .tab-count {
    display: inline-block;
    background: var(--success);
    color: white;
    border-radius: 99px;
    font-size: 10px;
    padding: 1px 6px;
    margin-left: 3px;
    font-weight: 700;
    vertical-align: middle;
    line-height: 1.6;

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* 注意ボックス */
  .notice-box {
    font-size: 12px;
    color: #6b4f00;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 10px;

    line-height: 1.8;
    margin-bottom: 16px;

  .field-row {
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s;

  .field-row.has-file { border-color: var(--primary); background: #eff6ff; }
  .field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
    gap: 8px;

  .field-label { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
  .field-status { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .field-status.ready { color: var(--success); font-weight: 600; }
  .chevron { font-size: 11px; color: var(--sub); transition: transform 0.2s; flex-shrink: 0; }
  .field-row.open .chevron { transform: rotate(180deg); }

    border-top: 1.5px solid var(--border);
    padding: 12px 14px;
    display: none;

    padding: 7px 10px;

    color: var(--text);

  .file-remove {
    background: none;
    border: none;
    color: #e53e3e;
    font-size: 15px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;

  .add-file-label {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: white;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    color: var(--sub);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }
  .add-file-label:hover { background: var(--hover); border-color: var(--primary); color: var(--primary); }
  .hint { font-size: 11px; color: var(--sub); margin-top: 6px; text-align: center; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 12px;

  .submit-btn:hover { background: var(--primary-dark); }
  .submit-btn:disabled { background: #a0aec0; cursor: not-allowed; }
  .progress-wrap {
    display: none;
    background: #e2e8f0;
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 12px;

  .progress-bar {
    height: 100%;
    background: var(--primary);
    border-radius: 99px;
    transition: width 0.3s;
    width: 0%;

  .status-msg {
    display: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.6;

  .status-msg.error { background: var(--error-bg); border: 1.5px solid var(--error-border); color: var(--error); }

async function notifyUploadToSystem(fileCount, companyId, companyName) {
  // companyId・companyName両方なくてもとりあえず送る（テーブル存在確認も兼ねる）
  try {
    const payload = {
      file_count: fileCount,
      source: 'jaim_dataup',
      created_at: new Date().toISOString()
    };
    if (companyId) payload.company_id = companyId;
    if (companyName) payload.company_name = companyName;
    if (FOLDER_ID) payload.folder_id = FOLDER_ID;
    console.log('📤 Supabase通知送信:', payload);
    const res = await _uplRpc('upload_notify', { p_payload: payload });
    if (res.ok) {
      console.log('✅ 案件管理システムに通知しました (HTTP ' + res.status + ')');
    } else {
      const errText = await res.text();
      console.error('❌ Supabase通知エラー (HTTP ' + res.status + '):', errText);
    }
  } catch(e) {
    console.error('❌ 通知送信例外:', e);
  }
}

// ver.20260525.01: 新パラメータ docs=BASE64URL(JSON [{l,r,t}])
const DOCS_PARAM = urlParams.get('docs') || '';
function _decodeDocsParam(s){
  if(!s) return null;
  try {
    var b64 = s.replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var txt = decodeURIComponent(escape(bin));
    var arr = JSON.parse(txt);
    if(!Array.isArray(arr)) return null;
    return arr;
  } catch(e){
    console.warn('docs param decode err:', e);
    return null;
  }
}
// ver.20260525.34: docs パラメータが空でも COMPANY_ID があれば upload_docs_cache から取得

let USE_NEW_DOCS = !!(DOCS_LIST && DOCS_LIST.length);

const SUPABASE_KEY_UPL = 'sb_publishable_3ptyILIpGIcNA5sUBhFMbA_n0VxpY2u';
function _loadDocsFromCache(){
  return new Promise(function(resolve){
    if(USE_NEW_DOCS){ resolve(DOCS_LIST); return; }
    if(!COMPANY_ID){ resolve(null); return; }
    _uplRpc('upload_docs_cache_get', { p_case_id: COMPANY_ID, p_kind: 'jaim' })
    .then(function(r){ return r.ok ? r.json() : null; }).then(function(docs){

        USE_NEW_DOCS = true;
        resolve(DOCS_LIST);
      } else {
        resolve(null);
      }
    }).catch(function(e){
      console.warn('upload_docs_cache rpc err:', e);
      resolve(null);
    });
  });

// ─── フィールド行を生成 ───
function buildFieldRow(key, docsMap) {
  const arr = fileData[key] || [];
  const hasFile = arr.length > 0;
  const row = document.createElement('div');
  row.className = 'field-row' + (hasFile ? ' has-file' : '');
  row.dataset.key = key;

  const header = document.createElement('div');
  header.className = 'field-header';
  header.innerHTML = `
    <span class="field-label">${_labelWithRuby(docsMap[key])}</span>
    <span class="field-status${hasFile ? ' ready' : ''}">${hasFile ? arr.length + '件選択済み ✓' : '未選択'}</span>
    <span class="chevron">▼</span>
  `;
  header.onclick = () => row.classList.toggle('open');

  const body = document.createElement('div');
  body.className = 'field-body';

  const fileListEl = document.createElement('div');
  fileListEl.className = 'file-list';
  renderFileList(key, fileListEl);
  body.appendChild(fileListEl);

  const addWrap = document.createElement('div');
  addWrap.className = 'add-btn-wrap';
  const label = document.createElement('label');
  label.className = 'add-file-label';
  label.innerHTML = '📷 ファイルを追加';
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,application/pdf';
  input.multiple = true;
  input.style.display = 'none';
  input.onchange = async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const b64 = await toBase64(file);
      if (!fileData[key]) fileData[key] = [];
      fileData[key].push({ name: file.name, mimeType: file.type || 'application/octet-stream', base64: b64 });
    }
    input.value = '';
    buildAllFields();
    updateSubmitBtn();
  };
  label.appendChild(input);
  addWrap.appendChild(label);
  body.appendChild(addWrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'JPG / PNG / PDF';
  body.appendChild(hint);

  row.appendChild(header);
  row.appendChild(body);
  if (hasFile) row.classList.add('open');
  return row;
}

function renderFileList(key, container) {
  container.innerHTML = '';
  const arr = fileData[key] || [];
  arr.forEach((d, i) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `<span class="file-item-name">📄 ${d.name}</span><button class="file-remove" title="削除">✕</button>`;
    item.querySelector('.file-remove').onclick = () => {
      fileData[key].splice(i, 1);
      buildAllFields();
      updateSubmitBtn();
    };
    container.appendChild(item);
  });
}

  for(var i=0;i<KOKKO_FILTERS.length;i++){

    if(f.targets.indexOf(name) >= 0 && window._kokkoFilterAns[f.id] === false){
      return true;

  return false;

// 条件フィルタUIを描画
function buildKokkoFilters(){
  // DOCS_LIST に条件付き書類が含まれる場合のみフィルタ表示
  var names = (DOCS_LIST||[]).map(function(d){ return d.l || ''; });
  var needFilters = KOKKO_FILTERS.filter(function(f){
    return f.targets.some(function(t){ return names.indexOf(t) >= 0; });
  });
  var box = document.getElementById('kokkoFilterBox');
  var qWrap = document.getElementById('kokkoFilterQuestions');
  if(!box || !qWrap) return;
  if(!needFilters.length){ box.style.display='none'; return; }
  box.style.display='block';
  qWrap.innerHTML = needFilters.map(function(f){
    var ans = window._kokkoFilterAns[f.id];
    function btn(val,label,color){
      var on = ans === val;
      return '<button onclick="setKokkoFilter(\''+f.id+'\','+val+')" style="flex:1;padding:7px;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;border:1.5px solid '+(on?color:'#cbd5e1')+';background:'+(on?color:'white')+';color:'+(on?'white':'#475569')+';">'+label+'</button>';
    }
    return '<div style="margin-bottom:10px;">'+
      '<div style="font-size:12px;font-weight:700;color:#0c4a6e;margin-bottom:5px;">'+f.q+'</div>'+
      '<div style="display:flex;gap:8px;">'+btn(true,'はい','#0369a1')+btn(false,'いいえ','#64748b')+'</div></div>';
  }).join('');
}

  const labelMap = {};

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = () => reject(new Error('Read failed'));
    r.readAsDataURL(file);
  });
}

});

        bar = document.createElement('div'); bar.id = 'uplStickyBar';
        var msg = document.createElement('div'); msg.id = 'uplStickyMsg';
        btn.parentNode.insertBefore(bar, btn); bar.appendChild(msg); bar.appendChild(btn);
      }
      var btnHidden = getComputedStyle(btn).display === 'none';
      bar.style.display = btnHidden ? 'none' : '';
      var o = collect(); var t = L();
      var sig = [currentLangSafe(), o.total, o.sel, o.sd, o.done, o.todo, btnHidden, o.rows.map(function(x){ return x.s + rowName(x.row); }).join('|')].join('/');
      if (sig === lastSig) return; lastSig = sig;
      var m = document.getElementById('uplStickyMsg');
      if (o.sel > 0) { m.textContent = t.pend.replace('{n}', o.sel); m.style.color = '#b45309'; }
      else if (o.todo + o.sd > 0 && o.done > 0) { m.textContent = t.left.replace('{n}', o.todo + o.sd); m.style.color = '#475569'; }
      else m.textContent = '';
      // 上のまとめ
      var old = document.getElementById('uplSummary'); if (old) old.remove();
      if (!o.total || btnHidden) return;
      var box = document.createElement('div'); box.id = 'uplSummary';
      var allDone = (o.done === o.total);
      if (allDone) box.className = 'all-done';
      var h = document.createElement('div'); h.className = 'us-head';
      h.textContent = allDone ? t.done : t.head.replace('{d}', o.done).replace('{t}', o.total);
      box.appendChild(h);
      if (!allDone) {
        var b = document.createElement('div'); b.className = 'us-bar';
        var f = document.createElement('div'); f.style.width = Math.round(o.done / o.total * 100) + '%'; b.appendChild(f); box.appendChild(b);
        // ver.20261125.06: 最初（まだ1件も提出していない）は件数とバーだけ。書類名は途中から出す（下の一覧と二重に見えるため）。選んだのに未送信の書類だけは常に出す
        var rest = o.rows.filter(function(x){ return x.s === 'sel' || (x.s === 'todo' && o.done > 0); });
        if (rest.length) {
          var ld = document.createElement('div'); ld.className = 'us-lead'; ld.textContent = t.lead; box.appendChild(ld);
          rest.sort(function(a, b){ return (isReq(b.row) - isReq(a.row)); });
          rest.forEach(function(x){
            var k = document.createElement('button'); k.type = 'button';
            var req = isReq(x.row);
            k.className = x.s === 'sel' ? 'sel' : (req ? 'req' : '');
            k.textContent = (x.s === 'sel' ? '📤 ' : (req ? '● ' : '○ ')) + (rowName(x.row) || '—') + (x.s === 'sel' ? '（' + t.sel + '）' : '');
            k.onclick = function(){ x.row.classList.add('open'); try { x.row.scrollIntoView({behavior:'smooth', block:'center'}); } catch(e){ x.row.scrollIntoView(); } };
            box.appendChild(k);
          });
        }
      }
      var sd = document.getElementById('sdBanner');
      var anchor = document.querySelector('.tabs-wrap') || document.querySelector('.fields-list');
      if (sd && sd.parentNode) sd.parentNode.insertBefore(box, sd.nextSibling);
      else if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(box, anchor);
    } catch(e){ console.warn('upl summary err:', e); }
  }
  function isReq(row){ var l = row.querySelector('.field-label'); return (l && l.textContent.indexOf('必須') !== -1) ? 1 : 0; }
  function currentLangSafe(){ return (typeof currentLang !== 'undefined') ? currentLang : 'ja'; }
  var timer = null;
  function schedule(){ if (timer) return; timer = setTimeout(function(){ timer = null; render(); }, 120); }
  new MutationObserver(function(muts){
    for (var i = 0; i < muts.length; i++) {
      var n = muts[i].target;
      if (n && n.closest && (n.closest('#uplSummary') || n.closest('#uplStickyMsg'))) continue;
      schedule(); return;
    }
  }).observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:['class','style']});
  document.addEventListener('click', schedule, true);
  window.addEventListener('resize', schedule);
  schedule();
  // 選んだのに送信していない書類があるまま閉じようとしたら確認を出す
  window.addEventListener('beforeunload', function(e){
    try { if (collect().sel > 0) { e.preventDefault(); e.returnValue = ''; return ''; } } catch(_){}
  });
})();
</script>
