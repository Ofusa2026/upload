<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>書類アップロード（所属機関）</title>
<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #1341a8;
    --success: #057a55;
    --success-bg: #f0fdf4;
    --success-border: #bbf7d0;
    --error: #9b1c1c;
    --error-bg: #fef2f2;
    --error-border: #fecaca;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1a202c;
    --sub: #718096;
    --border: #e2e8f0;
    --hover: #eff6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px 16px 60px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 28px 20px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .header { text-align: center; margin-bottom: 24px; }
  .office-name { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  .page-icon { font-size: 36px; margin-bottom: 8px; }
  h1 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--sub); line-height: 1.7; }
  .company-name-bar {
    background: #eff6ff;
    border: 1.5px solid #bfdbfe;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 20px;
    text-align: center;
  }

  /* ─── タブ ─── */
  .tabs-wrap {
    display: flex;
    background: #eef2f7;
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 20px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 11px 6px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--sub);
    cursor: pointer;
    transition: all 0.18s;
  }
  .tab-btn.active {
    background: var(--card);
    color: var(--primary);
    box-shadow: 0 2px 8px rgba(26,86,219,0.12);
  }
  .tab-btn .tab-count {
    display: inline-block;
    background: var(--success);
    color: white;
    border-radius: 99px;
    font-size: 10px;
    padding: 1px 6px;
    margin-left: 3px;
    font-weight: 700;
    vertical-align: middle;
    line-height: 1.6;
  }
  .tab-btn .tab-count.hidden { display: none; }

  /* ─── パネル ─── */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* 注意ボックス */
  .notice-box {
    font-size: 12px;
    color: #6b4f00;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 10px;
    padding: 10px 13px;
    line-height: 1.8;
    margin-bottom: 16px;
  }
  .notice-box a { color: var(--primary); text-decoration: underline; }

  /* ─── フィールド ─── */
  .fields-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .field-row {
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .field-row.has-file { border-color: var(--primary); background: #eff6ff; }
  .field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
    gap: 8px;

  .field-label { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
  .field-status { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .field-status.ready { color: var(--success); font-weight: 600; }
  .chevron { font-size: 11px; color: var(--sub); transition: transform 0.2s; flex-shrink: 0; }
  .field-row.open .chevron { transform: rotate(180deg); }
  .field-body {
    border-top: 1.5px solid var(--border);
    padding: 12px 14px;
    display: none;
  }
  .field-row.open .field-body { display: block; }

  .file-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    color: var(--text);
    gap: 6px;

  .file-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-remove {
    background: none;
    border: none;
    color: #e53e3e;
    font-size: 15px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;

  .add-file-label {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: white;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    color: var(--sub);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }
  .add-file-label:hover { background: var(--hover); border-color: var(--primary); color: var(--primary); }
  .hint { font-size: 11px; color: var(--sub); margin-top: 6px; text-align: center; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 12px;
  }
  .submit-btn:hover { background: var(--primary-dark); }
  .submit-btn:disabled { background: #a0aec0; cursor: not-allowed; }
  .progress-wrap {
    display: none;
    background: #e2e8f0;
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .progress-bar {
    height: 100%;
    background: var(--primary);
    border-radius: 99px;
    transition: width 0.3s;
    width: 0%;
  }
  .status-msg {
    display: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.6;
    white-space: pre-line;
    text-align: center;
  }
  .status-msg.success { background: var(--success-bg); border: 1.5px solid var(--success-border); color: var(--success); }
  .status-msg.error { background: var(--error-bg); border: 1.5px solid var(--error-border); color: var(--error); }
</style>
</head>
<body>
<div class="card">

async function notifyUploadToSystem(fileCount, companyId, companyName) {
  // companyId・companyName両方なくてもとりあえず送る（テーブル存在確認も兼ねる）
  try {
    const payload = {
      file_count: fileCount,
      source: 'company_dataup',
      created_at: new Date().toISOString()
    };
    if (companyId) payload.company_id = companyId;
    if (companyName) payload.company_name = companyName;
    if (FOLDER_ID) payload.folder_id = FOLDER_ID;
    console.log('📤 Supabase通知送信:', payload);
    const res = await _uplRpc('upload_notify', { p_payload: payload });
    if (res.ok) {
      console.log('✅ 案件管理システムに通知しました (HTTP ' + res.status + ')');
    } else {
      const errText = await res.text();
      console.error('❌ Supabase通知エラー (HTTP ' + res.status + '):', errText);
    }
  } catch(e) {
    console.error('❌ 通知送信例外:', e);
  }
}

// ver.20260525.01: 新パラメータ docs=BASE64URL(JSON [{l,r,t}])
const DOCS_PARAM = urlParams.get('docs') || '';
function _decodeDocsParam(s){
  if(!s) return null;
  try {
    var b64 = s.replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var txt = decodeURIComponent(escape(bin));
    var arr = JSON.parse(txt);
    if(!Array.isArray(arr)) return null;
    return arr;
  } catch(e){
    console.warn('docs param decode err:', e);
    return null;
  }
}
// ver.20260525.34: docs パラメータが空でも COMPANY_ID があれば upload_docs_cache から取得
let DOCS_LIST = _decodeDocsParam(DOCS_PARAM);
let USE_NEW_DOCS = !!(DOCS_LIST && DOCS_LIST.length);

const SUPABASE_URL_UPL = 'https://ehwlgbwpycglmopiqyty.supabase.co';
const SUPABASE_KEY_UPL = 'sb_publishable_3ptyILIpGIcNA5sUBhFMbA_n0VxpY2u';
function _loadDocsFromCache(){
  return new Promise(function(resolve){
    if(USE_NEW_DOCS){ resolve(DOCS_LIST); return; }
    if(!COMPANY_ID){ resolve(null); return; }
    _uplRpc('upload_docs_cache_get', { p_case_id: COMPANY_ID, p_kind: 'company' })
    .then(function(r){ return r.ok ? r.json() : null; }).then(function(docs){
      if(docs && Array.isArray(docs) && docs.length){
        DOCS_LIST = docs;
        USE_NEW_DOCS = true;
        resolve(DOCS_LIST);
      } else {
        resolve(null);
      }
    }).catch(function(e){
      console.warn('upload_docs_cache rpc err:', e);
      resolve(null);
    });
  });
}

// ver.20260616.01: docs パラメータも upload_docs_cache も無い場合に、ハードコード書類辞書を
// 新ロジック用の DOCS_LIST 形式 [{l, t, r}] に変換する。これで旧ロジック描画(done未対応)を経由せず、
// 常に新ブランチ(グレーアウト対応)＋ _applyLiveDoneFromCoDocCheck に通せる。
function _buildFallbackDocsList(){
  var out = [];
  (typeof LARGE_KEYS !== 'undefined' ? LARGE_KEYS : []).forEach(function(k){ if(LARGE_DOCS[k]) out.push({ l: LARGE_DOCS[k], t: 'large', r: 0 }); });
  (typeof NORMAL_KEYS !== 'undefined' ? NORMAL_KEYS : []).forEach(function(k){ if(NORMAL_DOCS[k]) out.push({ l: NORMAL_DOCS[k], t: 'normal', r: 0 }); });
  (typeof KOJIN_KEYS !== 'undefined' ? KOJIN_KEYS : []).forEach(function(k){ if(KOJIN_DOCS[k]) out.push({ l: KOJIN_DOCS[k], t: 'kojin', r: 0 }); });
  return out;
}

// ver.20260616.03: 正本(settings.required_docs_co / _large / _kojin)をRPCで取得してDOCS_LISTを構築（脱ハードコード）。
// index.html が co_doc_check に書く正規名と同一の配列なので、表示ラベルとグレーアウト判定が常に一致し、別名や手修正が不要になる。
function _loadRequiredDocsFromDB(){
  return new Promise(function(resolve){
    _uplRpc('upload_required_docs_get', {})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if(!d || typeof d!=='object'){ resolve(null); return; }
      var out=[];
      function add(arr,t){ (Array.isArray(arr)?arr:[]).forEach(function(l){ l=(l==null?'':String(l)).trim(); if(l) out.push({ l:l, t:t, r:0 }); }); }
      add(d.large,'large'); add(d.normal,'normal'); add(d.kojin,'kojin');
      // 任意提出枠「その他」（ハードコード版と同様に中小・個人事業主に用意）
      if(Array.isArray(d.normal) && d.normal.length) out.push({ l:'その他', t:'normal', r:0 });
      if(Array.isArray(d.kojin)  && d.kojin.length)  out.push({ l:'その他', t:'kojin',  r:0 });
      resolve(out.length ? out : null);
    })
    .catch(function(e){ console.warn('required_docs rpc err:', e); resolve(null); });
  });
}

  ['large', 'normal', 'kojin'].forEach(t => {
    const panelId = t === 'large' ? 'panelLarge' : t === 'normal' ? 'panelNormal' : 'panelKojin';
    const btnId   = t === 'large' ? 'tabBtnLarge' : t === 'normal' ? 'tabBtnNormal' : 'tabBtnKojin';

    document.getElementById(btnId).classList.toggle('active', t === tab);
  });
}

// 書類名(ラベル)のキーワードから見本キーを判定（動的キー d0.. / 固定キー 両対応）
function _coSampleKeyByLabel(label){
  var t = String(label||'');
  var has = function(){ for(var i=0;i<arguments.length;i++){ if(t.indexOf(arguments[i])<0) return false; } return true; };
  if(t.indexOf('登記事項')>=0) return 'tokibo';
  if(t.indexOf('法定調書')>=0 || t.indexOf('四季報')>=0 || t.indexOf('上場証明')>=0) return 'houtei';
  if(t.indexOf('協議会')>=0) return 'kyogikai';
  if(t.indexOf('個人住民税')>=0) return 'kojin_shimin';
  if(t.indexOf('法人住民税')>=0 || has('地方税','法人')) return 'zeimu_shimin';
  if(t.indexOf('納税証明')>=0){
    if(t.indexOf('法人税')>=0) return 'zeimu_3';
    if(t.indexOf('申告所得税')>=0 || t.indexOf('相続税')>=0 || t.indexOf('贈与税')>=0) return 'kojin_zeimu3';
    return 'zeimu_3';
  }
  if(t.indexOf('労働保険')>=0) return 'rodo_hoken';
  if(t.indexOf('社会保険料')>=0) return 'shakai_hoken';
  if(t.indexOf('住民票')>=0) return (t.indexOf('役員')>=0) ? 'jumin_hyo' : 'kojin_jumin';
  if(t.indexOf('決算')>=0) return 'kessan';
  if(t.indexOf('就業規則')>=0) return 'shugyo_kisoku';
  if(t.indexOf('賃金')>=0) return 'chingin_kitei';
  if(t.indexOf('36協定')>=0 || t.indexOf('３６協定')>=0 || t.indexOf('時間外労働')>=0) return 'san_roku';
  if(t.indexOf('変形労働')>=0) return 'henkei_rodo';
  if(t.indexOf('年間カレンダー')>=0) return 'nengkan_cal';
  if(t.indexOf('間取り')>=0 || t.indexOf('物件')>=0 || t.indexOf('居住予定')>=0) return 'madori';
  if(t.indexOf('医療保険')>=0 || t.indexOf('資格確認書')>=0 || t.indexOf('マイナポータル')>=0) return 'kojin_iryo';
  if(t.indexOf('国民健康保険')>=0) return 'kojin_kokuho';
  if(t.indexOf('被保険者記録照会回答票')>=0) return 'kojin_nenkin_rec';
  if(t.indexOf('被保険者記録照会')>=0 || t.indexOf('国民年金')>=0) return 'kojin_nenkin_fu';
  return null;
}

function buildFieldRow(key, docsMap) {
  const arr = fileData[key] || [];
  const hasFile = arr.length > 0;
  const row = document.createElement('div');
  row.className = 'field-row' + (hasFile ? ' has-file' : '');
  row.dataset.key = key;

  const header = document.createElement('div');
  header.className = 'field-header';
  header.innerHTML = `
    <span class="field-label">${_labelWithRuby(docsMap[key])}</span>
    <span class="field-status${hasFile ? ' ready' : ''}">${hasFile ? arr.length + '件選択済み ✓' : '未選択'}</span>
    <span class="chevron">▼</span>
  `;
  header.onclick = () => row.classList.toggle('open');

  const body = document.createElement('div');
  body.className = 'field-body';
  var __si = buildCompanySampleInline(docsMap[key]); if(__si) body.appendChild(__si); // ver.20260619.06: 見本（説明＋画像）を本体先頭に表示

  const fileListEl = document.createElement('div');
  fileListEl.className = 'file-list';
  renderFileList(key, fileListEl);
  body.appendChild(fileListEl);

  const addWrap = document.createElement('div');
  addWrap.className = 'add-btn-wrap';
  const label = document.createElement('label');
  label.className = 'add-file-label';
  label.innerHTML = '📷 ファイルを追加';
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,application/pdf';
  input.multiple = true;
  input.style.display = 'none';
  input.onchange = async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const b64 = await toBase64(file);
      if (!fileData[key]) fileData[key] = [];
      fileData[key].push({ name: file.name, mimeType: file.type || 'application/octet-stream', base64: b64 });
    }
    input.value = '';
    buildAllFields();
    updateSubmitBtn();
  };
  label.appendChild(input);
  addWrap.appendChild(label);
  body.appendChild(addWrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'JPG / PNG / PDF';
  body.appendChild(hint);

  row.appendChild(header);
  row.appendChild(body);
  if (hasFile) row.classList.add('open');
  return row;
}

function renderFileList(key, container) {
  container.innerHTML = '';

  arr.forEach((d, i) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `<span class="file-item-name">📄 ${d.name}</span><button class="file-remove" title="削除">✕</button>`;

      fileData[key].splice(i, 1);

  });
}

function buildAllFields() {
  // ver.20260525.01: docsパラメータがあれば、それに従って書類リストを構築
  if (USE_NEW_DOCS) {
    // 新ロジック: DOCS_LIST = [{l: '書類名', r: 1, t: 'large'|'normal'|'kojin'}, ...]
    // 各書類に安定キー 'd0', 'd1', ... を割り当てて、tでタブ振り分け
    const buckets = { large: [], normal: [], kojin: [] };
    const labelMap = {};  // key → 日本語ラベル
    DOCS_LIST.forEach(function(d, i){
      const key = 'd' + i;
      const t = d.t || 'normal';
      labelMap[key] = d.l || '';
      if (!buckets[t]) buckets[t] = [];
      buckets[t].push({key: key, label: d.l || '', req: !!d.r, done: !!d.done, note: d.note || ''});
    });
    window._docLabelMap = labelMap;
    // ver.20260611.04: 送信判定用に実際の描画キー(d0..dN)を保持（固定配列だと動的書類を拾えず送信ボタンが押せない不具合の修正）
    window._allDocKeys = DOCS_LIST.map(function(d, i){ return 'd' + i; });

    // バッジ更新用に各タブの書類数表示
    const renderBucket = function(listEl, items){
      listEl.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:20px;text-align:center;color:#94a3b8;font-size:13px;';
        empty.textContent = 'この区分の書類はありません';
        listEl.appendChild(empty);
        return;
      }
      // docsMap を動的構築
      const docsMap = {};
      items.forEach(function(it){ docsMap[it.key] = it.label; });
      items.forEach(function(it){
        const row = buildFieldRow(it.key, docsMap);
        const labelEl = row.querySelector('.field-label');
        // 必須マーク
        if (it.req && labelEl && labelEl.innerHTML.indexOf('必須') === -1) {
          labelEl.innerHTML = '<span style="color:#dc2626;font-size:11px;margin-right:3px;">必須</span>' + labelEl.innerHTML;
        }
        // ver.20260603: 取得済み/不要はグレーアウト（国交省アップロードと同様・再提出は可能）
        if (it.done) {
          row.style.background = '#cbd5e1';
          row.style.borderColor = '#94a3b8';
          row.style.opacity = '0.7';
          if (labelEl) {
            const doneEl = document.createElement('span');
            doneEl.style.cssText = 'color:#16a34a;font-size:11px;font-weight:700;margin-left:4px;';
            doneEl.textContent = '✓ 提出済み（再提出が必要な場合のみ）';
            labelEl.appendChild(doneEl);
          }
        }
        if (it.note && labelEl) {
          const noteEl = document.createElement('div');
          noteEl.style.cssText = 'font-size:11px;color:#b45309;font-weight:400;margin-top:4px;line-height:1.6;';
          noteEl.textContent = '💡 ' + it.note;
          labelEl.appendChild(noteEl);
        }
        listEl.appendChild(row);
      });
    };
    renderBucket(document.getElementById('fieldsListLarge'),  buckets.large || []);
    renderBucket(document.getElementById('fieldsListNormal'), buckets.normal || []);
    renderBucket(document.getElementById('fieldsListKojin'),  buckets.kojin || []);

    // 書類があるタブを初期表示にする（normal優先 → kojin → large）
    if ((buckets.normal||[]).length === 0 && (buckets.kojin||[]).length > 0) {
      switchTab('kojin');
    } else if ((buckets.normal||[]).length === 0 && (buckets.kojin||[]).length === 0 && (buckets.large||[]).length > 0) {
      switchTab('large');
    }
    return;
  }

  // 旧ロジック（後方互換）
  // 大企業タブ
  const listLarge = document.getElementById('fieldsListLarge');
  listLarge.innerHTML = '';
  LARGE_KEYS.forEach(key => listLarge.appendChild(buildFieldRow(key, LARGE_DOCS)));

  // 中小企業タブ
  const listNormal = document.getElementById('fieldsListNormal');
  listNormal.innerHTML = '';
  NORMAL_KEYS.forEach(key => listNormal.appendChild(buildFieldRow(key, NORMAL_DOCS)));

  // 個人事業主タブ
  const listKojin = document.getElementById('fieldsListKojin');
  listKojin.innerHTML = '';
  KOJIN_KEYS.forEach(key => listKojin.appendChild(buildFieldRow(key, KOJIN_DOCS)));

  // ver.20260611.04: 送信判定用に描画キーを保持（旧モードは固定キー）
  window._allDocKeys = [...LARGE_KEYS, ...NORMAL_KEYS, ...KOJIN_KEYS];

  // タブバッジ更新
  const cntL = LARGE_KEYS.filter(k => fileData[k] && fileData[k].length > 0).length;
  const cntN = NORMAL_KEYS.filter(k => fileData[k] && fileData[k].length > 0).length;
  const cntK = KOJIN_KEYS.filter(k => fileData[k] && fileData[k].length > 0).length;
  document.getElementById('countLarge').textContent = cntL;
  document.getElementById('countLarge').className = 'tab-count' + (cntL > 0 ? '' : ' hidden');
  document.getElementById('countNormal').textContent = cntN;
  document.getElementById('countNormal').className = 'tab-count' + (cntN > 0 ? '' : ' hidden');
  document.getElementById('countKojin').textContent = cntK;
  document.getElementById('countKojin').className = 'tab-count' + (cntK > 0 ? '' : ' hidden');
}

function updateSubmitBtn() {

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = () => reject(new Error('Read failed'));
    r.readAsDataURL(file);
  });
}

function _applyLiveDoneFromCoDocCheck(){
  // ver.20260607.01: co_doc_check をライブ読みして done(取得済み/不要) を上書き（キャッシュのスナップショットに依存しない）
  return new Promise(function(resolve){
    if(!COMPANY_ID || !Array.isArray(DOCS_LIST) || !DOCS_LIST.length){ resolve(); return; }
    _uplRpc('upload_co_doc_check_get', { p_co_id: COMPANY_ID })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){
      var doneSet = {};
      (rows||[]).forEach(function(row){
        var dk = row.doc_key || ''; var idx = dk.indexOf('::'); if(idx<0) return;
        var prefix = dk.substring(0, idx); var name = dk.substring(idx+2);
        var v = row.value; var truthy = (v!=null && v!=='' && v!=='false');
        if((prefix==='staff' || prefix==='skip') && truthy){ doneSet[name] = true; }
      });
      DOCS_LIST.forEach(function(d){
        if(d && d.l){
          var alias = DOC_DONE_ALIAS[d.l];
          d.done = !!(doneSet[d.l] || (alias && doneSet[alias]));
        }
      });
      resolve();
    })
    .catch(function(e){ console.warn('co_doc_check live fetch err:', e); resolve(); });
  });
}

// ver.20260525.34: DBキャッシュから書類リストを取得してから初期描画
(async function _initDocsAndBuild(){
  try { await _loadDocsFromCache(); } catch(e){ console.warn('_initDocsAndBuild err:', e); }
  // キャッシュがnormalのみ（区分未設定）の場合はDBから全タイプを取得して補完
  if(Array.isArray(DOCS_LIST) && DOCS_LIST.length && DOCS_LIST.every(function(d){ return d.t === 'normal'; })){
    try {
      var _db = await _loadRequiredDocsFromDB();
      if(_db && _db.length){ DOCS_LIST = _db; USE_NEW_DOCS = true; }
    } catch(e){ console.warn('required_docs supplement err:', e); }
  }
  // ver.20260616.03: docs/キャッシュが無ければ正本(settings.required_docs_*)をRPCで取得（脱ハードコード）。
  if(!(Array.isArray(DOCS_LIST) && DOCS_LIST.length)){

    catch(e){ console.warn('required_docs err:', e); }
  }
  // それでも取得できなければハードコード辞書を最終フォールバックに（通常は到達しない）。
  if(!(Array.isArray(DOCS_LIST) && DOCS_LIST.length)){

  buildAllFields();
})();

document.getElementById('submitBtn').addEventListener('click', async () => {
  // ver.20260525.01: 新ロジックでは window._docLabelMap、旧ロジックでは LARGE/NORMAL/KOJIN_DOCS を結合
  let allKeys, allDocs;
  if (USE_NEW_DOCS && window._docLabelMap) {
    allKeys = Object.keys(window._docLabelMap);
    allDocs = window._docLabelMap;
  } else {
    allKeys = [...LARGE_KEYS, ...NORMAL_KEYS, ...KOJIN_KEYS];
    allDocs = { ...LARGE_DOCS, ...NORMAL_DOCS, ...KOJIN_DOCS };
  }
  const hasAny = allKeys.some(k => fileData[k] && fileData[k].length > 0);
  if (!hasAny) { alert('少なくとも1つのファイルを選択してください'); return; }

  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');

  submitBtn.disabled = true;
  statusMsg.style.display = 'none';
  progressWrap.style.display = 'block';
  progressBar.style.width = '10%';

  const timestamp = Date.now();
  const filesPayload = [];
  allKeys.forEach(key => {
    const arr = fileData[key] || [];
    arr.forEach((d, i) => {
      const ext = d.name.split('.').pop() || 'jpg';
      const suffix = arr.length > 1 ? '_' + (i + 1) : '';
      filesPayload.push({
        name: allDocs[key] + suffix + '.' + ext,
        docLabel: allDocs[key],
        mimeType: d.mimeType,
        data: d.base64,
      });
    });
  });

  try {
    progressBar.style.width = '40%';
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ files: filesPayload, folderId: FOLDER_ID }),
    });
    progressBar.style.width = '90%';
    const json = await res.json();
    if (json.success) {
      progressBar.style.width = '100%';
      statusMsg.className = 'status-msg success';
      statusMsg.textContent = '✅ アップロード完了しました！\n担当者に届きました。';
      statusMsg.style.display = 'block';
      // 案件管理システムにアップロード通知
      notifyUploadToSystem(filesPayload.length, COMPANY_ID, COMPANY_NAME);
      // ver.20260611.02: 書類ごとにドライブURLを保存（応答 json.files[] は filesPayload と同順）
      try {
        var _resFiles = Array.isArray(json.files) ? json.files : [];
        for (var _fi = 0; _fi < filesPayload.length; _fi++) {
          var _rf = _resFiles[_fi] || {};
          var _durl = _rf.url || _rf.webViewLink || _rf.fileUrl || (_rf.id ? ('https://drive.google.com/file/d/' + _rf.id + '/view') : '');
          if (!_durl) continue;
          _uplRpc('upload_notify', { p_payload: {
            company_id: COMPANY_ID,
            company_name: COMPANY_NAME,
            folder_id: FOLDER_ID,
            file_count: 1,
            file_names: filesPayload[_fi].name,
            doc_label: filesPayload[_fi].docLabel,
            drive_url: _durl,
            source: 'company_dataup'
          } });
        }
      } catch (e) { console.warn('URL通知保存失敗:', e); }
      allKeys.forEach(k => delete fileData[k]);
      buildAllFields();
      updateSubmitBtn();
    } else {
      throw new Error(json.error || 'error');
    }
  } catch (err) {
    statusMsg.className = 'status-msg error';
    statusMsg.textContent = '❌ 送信に失敗しました。\nもう一度お試しください。';
    statusMsg.style.display = 'block';
    submitBtn.disabled = false;
  }

  setTimeout(() => {
    progressWrap.style.display = 'none';
    progressBar.style.width = '0%';
  }, 1200);
});
</script>
</body>
</html>
