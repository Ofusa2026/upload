<!-- oshiin_dataup ver.20261127.01 - 新規：押印済み書類のアップロード（会社用）。案シスの押印リンクの結果画面で「📤 提出用リンクを入れる」を選ぶと、依頼文にこのページのURL（?t=トークン）が入る。
     ・中身は Supabase の oshiin_upload_get（会社名・対象者・期限・押印する書類）で読む。テーブルは直接さわらない
     ・ファイルは、ほかのアップロード画面と同じ GAS で「いちばん目の人の人材フォルダ」に入れ、oshiin_upload_submit で名前とURLを記録する
     ・記録されると案シスの通知バー「🏢 押印完了」に出る -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex, nofollow">
<!-- 画像圧縮・HEIC変換ライブラリ（ほかのアップロード画面と同じ） -->
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<title>押印済み書類のアップロード</title>
<style>
  :root {
    --primary: #1a56db; --primary-dark: #1341a8;
    --success: #057a55; --success-bg: #f0fdf4; --success-border: #bbf7d0;
    --error: #9b1c1c; --error-bg: #fef2f2; --error-border: #fecaca;
    --bg: #f0f4f8; --card: #ffffff; --text: #1a202c; --sub: #718096; --border: #e2e8f0; --hover: #eff6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh;
         display: flex; align-items: flex-start; justify-content: center; padding: 20px 16px 110px; color: var(--text); }
  .card { background: var(--card); border-radius: 20px; padding: 28px 20px; max-width: 520px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .header { text-align: center; margin-bottom: 20px; }
  .office-name { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  .page-icon { font-size: 36px; margin-bottom: 8px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--sub); line-height: 1.7; }
  .company-name-bar { background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 700;
                      color: var(--primary); margin-bottom: 14px; text-align: center; word-break: break-all; }
  .info { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.7; }
  .info .lbl { font-size: 11px; font-weight: 700; color: var(--sub); }
  .persons { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .persons span { font-size: 13px; padding: 2px 10px; border: 1px solid #cbd5e1; border-radius: 99px; background: #f8fafc; }
  .doc-link { display: block; margin-top: 8px; padding: 10px 12px; background: #fff; border: 1.5px solid #93c5fd; border-radius: 10px; color: #1d4ed8;
              font-size: 14px; font-weight: 700; text-decoration: none; text-align: center; }
  .how { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.75; color: #92400e; margin-bottom: 14px; }
  .drop { border: 2px dashed #93c5fd; border-radius: 14px; background: #f8fbff; padding: 22px 14px; text-align: center; cursor: pointer; transition: .15s; }
  .drop.over { background: var(--hover); border-color: var(--primary); }
  .drop .big { font-size: 30px; }
  .drop .t1 { font-size: 15px; font-weight: 700; margin-top: 4px; }
  .drop .t2 { font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.6; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btn2 { flex: 1; padding: 12px 8px; font-size: 14px; font-weight: 700; border-radius: 10px; border: 1.5px solid var(--primary); background: #fff; color: var(--primary); cursor: pointer; }
  .btn2.cam { background: var(--primary); color: #fff; }
  .files { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .file { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; }
  .file img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #f1f5f9; }
  .file .ic { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #f1f5f9; border-radius: 6px; flex-shrink: 0; }
  .file .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .sz { font-size: 11px; color: var(--sub); flex-shrink: 0; }
  .file .x { border: none; background: none; color: #dc2626; font-size: 18px; cursor: pointer; padding: 0 4px; flex-shrink: 0; }
  textarea { width: 100%; margin-top: 12px; min-height: 70px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; font-family: inherit; }
  .done-box { background: var(--success-bg); border: 1px solid var(--success-border); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--success); line-height: 1.7; margin-bottom: 14px; }
  .err-box { background: var(--error-bg); border: 1px solid var(--error-border); border-radius: 12px; padding: 14px; font-size: 14px; color: var(--error); line-height: 1.75; }
  .submit-wrap { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; justify-content: center; z-index: 10; }
  .submit-btn { width: 100%; max-width: 520px; padding: 15px; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; background: var(--primary); color: #fff; cursor: pointer; }
  .submit-btn:disabled { background: #cbd5e1; cursor: default; }
  .progress-wrap { height: 6px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-top: 12px; display: none; }
  .progress-bar { height: 100%; width: 0; background: var(--primary); transition: width .3s; }
  .status-msg { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.7; background: #f8fafc; white-space: pre-line; }
  .status-msg.success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
  .status-msg.error { background: var(--error-bg); color: var(--error); border: 1px solid var(--error-border); }
  .ver { text-align: center; font-size: 10px; color: #cbd5e1; margin-top: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="office-name">大房行政書士法人</div>
    <div class="page-icon">🏢</div>
    <h1>押印済み書類のアップロード</h1>
    <div class="subtitle">押印いただいた書類（印のあるページ）を、こちらからお送りください。</div>
  </div>

  <div id="loading" style="text-align:center;font-size:14px;color:var(--sub);padding:20px 0;">読み込んでいます…</div>
  <div id="errBox" class="err-box hidden"></div>

  <div id="main" class="hidden">
    <div class="company-name-bar" id="coName"></div>
    <div class="info">
      <div class="lbl">対象者</div>
      <div class="persons" id="persons"></div>
      <div class="lbl">有効期限</div>
      <div id="expiry" style="font-weight:700;"></div>
      <a id="docLink" class="doc-link hidden" href="#" target="_blank" rel="noopener">📑 押印する書類を開く</a>
    </div>
    <div id="doneBox" class="done-box hidden"></div>
    <div class="how">
      ① 書類に押印してください。<br>
      ② <b>印のあるページ</b>を、PDFか写真でお送りください（ページが複数あるときは、すべてお願いします）。<br>
      パソコン：下の枠にファイルをドラッグ＆ドロップ<br>
      スマートフォン：［📷 撮影する］でそのまま撮影できます
    </div>

    <div class="drop" id="drop">
      <div class="big">📤</div>
      <div class="t1">ここにファイルをドラッグ＆ドロップ</div>
      <div class="t2">または、押してファイルを選ぶ（PDF・JPG・PNG／1ファイル25MBまで）</div>
    </div>
    <div class="btns">
      <button class="btn2" type="button" id="pickBtn">📁 ファイルを選ぶ</button>
      <button class="btn2 cam" type="button" id="camBtn">📷 撮影する</button>
    </div>
    <input type="file" id="fileIn" accept="application/pdf,image/*,.heic,.heif" multiple class="hidden">
    <input type="file" id="camIn" accept="image/*" capture="environment" class="hidden">

    <div class="files" id="files"></div>
    <textarea id="note" placeholder="ご連絡事項があればご記入ください（任意）"></textarea>
    <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
  <div class="ver">oshiin_dataup ver.20261127.01</div>
</div>
<div class="submit-wrap hidden" id="submitWrap"><button class="submit-btn" id="submitBtn" disabled>送信する</button></div>

<script>
// ほかのアップロード画面（tsuikan_company_dataup.html など）と同じ送り先
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzqddeEti71WWCR9CanUR5zFf1ikUywHs-ES2CyqTucmaRfYaevz4yBqNHJx-_LIf3JCQ/exec';
const SB_URL = 'https://ehwlgbwpycglmopiqyty.supabase.co';
const SB_KEY = 'sb_publishable_3ptyILIpGIcNA5sUBhFMbA_n0VxpY2u';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
var UPL_MAX_FILE_MB = 25, UPL_TIMEOUT_MS = 180000, MAX_FILES = 20;
var META = null, picked = [];

function rpc(fn, body){ return fetch(SB_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}, body: JSON.stringify(body||{}) }); }
function $(id){ return document.getElementById(id); }
function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function mb(b){ return (b/1024/1024).toFixed(1)+'MB'; }
function md(iso){ var d=new Date(iso); return isNaN(d) ? '' : (d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'); }
function mdhm(iso){ var d=new Date(iso); return isNaN(d) ? '' : ((d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)); }
function showErr(msg){ $('loading').classList.add('hidden'); $('main').classList.add('hidden'); $('submitWrap').classList.add('hidden'); var b=$('errBox'); b.textContent=msg; b.classList.remove('hidden'); }

// ---- 読み込み ----
async function load(){
  if(!TOKEN || TOKEN.length < 20){ showErr('このURLでは書類を表示できません（URLが途中で切れている可能性があります）。お手数ですが、大房行政書士法人の担当者までご連絡ください。'); return; }
  try{
    var r = await rpc('oshiin_upload_get', { p_token: TOKEN });
    if(!r.ok) throw new Error('HTTP '+r.status);
    var o = await r.json();
    if(!o || typeof o !== 'object'){ showErr('このURLでは書類を表示できません。お手数ですが、大房行政書士法人の担当者までご連絡ください。'); return; }
    META = o;
  }catch(e){ showErr('読み込めませんでした（通信エラー）。電波の良い場所で、ページを開き直してください。'); return; }
  if(META.expired){ showErr('このアップロード用URLは有効期限（'+md(META.expires_at)+'）が過ぎています。お手数ですが、大房行政書士法人の担当者までご連絡ください。'); return; }
  $('loading').classList.add('hidden'); $('main').classList.remove('hidden'); $('submitWrap').classList.remove('hidden');
  $('coName').textContent = (META.company || '') + (META.company ? ' 御中' : '');
  $('persons').innerHTML = (META.persons||[]).map(function(n){ return '<span>'+esc(n)+' 様</span>'; }).join('') || '<span>—</span>';
  $('expiry').textContent = md(META.expires_at) + ' まで';
  if(META.oshiin_url && /^https:\/\//.test(META.oshiin_url)){ var a=$('docLink'); a.href=META.oshiin_url; a.classList.remove('hidden'); }
  renderDone();
}
function renderDone(){
  var fs = (META && META.files) || [], b = $('doneBox');
  if(!fs.length){ b.classList.add('hidden'); return; }
  b.innerHTML = '✅ これまでに <b>'+fs.length+'件</b> 受け取っています（最後：'+esc(mdhm(META.uploaded_at))+'）<br>'
    + fs.map(function(f){ return '・'+esc(f.name); }).join('<br>')
    + '<br><span style="color:#475569;">足りないページがあれば、追加でお送りください。</span>';
  b.classList.remove('hidden');
}

// ---- ファイルを選ぶ ----
function checkFile(file){
  var name = file && file.name || '', t = file && file.type || '';
  var isImg = /^image\//.test(t) || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(name);
  var isPdf = t === 'application/pdf' || /\.pdf$/i.test(name);
  if(!isImg && !isPdf) return '「'+name+'」は対応していない形式です（PDF・JPG・PNGのみ）。Word・Excelは、PDFにするか写真に撮ってお送りください。';
  if(!file.size) return '「'+name+'」は中身が空（0バイト）です。保存し直してから選んでください。';
  if(isPdf && file.size > UPL_MAX_FILE_MB*1024*1024) return '「'+name+'」は '+mb(file.size)+' あり大きすぎます（1ファイル'+UPL_MAX_FILE_MB+'MBまで）。ページを分けてお送りください。';
  return '';
}
function addFiles(list){
  var bad = [];
  Array.prototype.forEach.call(list || [], function(f){
    var m = checkFile(f); if(m){ bad.push(m); return; }
    if(picked.length >= MAX_FILES){ bad.push('一度に送れるのは'+MAX_FILES+'ファイルまでです。分けて送信してください。'); return; }
    picked.push({ file:f, url: /^image\//.test(f.type) ? URL.createObjectURL(f) : '' });
  });
  if(bad.length) alert('次のファイルは追加できませんでした。\n\n' + bad.filter(function(v,i,a){ return a.indexOf(v)===i; }).join('\n\n'));
  renderPicked();
}
function removeFile(i){ var p=picked[i]; if(p && p.url) URL.revokeObjectURL(p.url); picked.splice(i,1); renderPicked(); }
function renderPicked(){
  $('files').innerHTML = picked.map(function(p, i){
    var f = p.file;
    return '<div class="file">'+(p.url ? '<img src="'+p.url+'" alt="">' : '<div class="ic">📄</div>')
      +'<span class="nm">'+esc(f.name)+'</span><span class="sz">'+mb(f.size)+'</span><button class="x" type="button" title="外す" onclick="removeFile('+i+')">✕</button></div>';
  }).join('');
  var b = $('submitBtn'); b.disabled = !picked.length; b.textContent = picked.length ? ('送信する（'+picked.length+'件）') : '送信する';
}
(function(){
  var drop=$('drop'), fi=$('fileIn'), ci=$('camIn');
  drop.addEventListener('click', function(){ fi.click(); });
  $('pickBtn').addEventListener('click', function(){ fi.click(); });
  $('camBtn').addEventListener('click', function(){ ci.click(); });
  fi.addEventListener('change', function(){ addFiles(fi.files); fi.value=''; });
  ci.addEventListener('change', function(){ addFiles(ci.files); ci.value=''; });
  ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function(e){ addFiles(e.dataTransfer && e.dataTransfer.files); });
  // 枠の外に落としてもブラウザでファイルが開かないように
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('drop', function(e){ e.preventDefault(); });
  $('submitBtn').addEventListener('click', submit);
  window.addEventListener('beforeunload', function(e){ if(picked.length && !window._sending){ e.preventDefault(); e.returnValue=''; } });
})();

// ---- 送信 ----
async function prepFile(file){   // HEIC→JPEG・写真は自動で小さくする（ほかのアップロード画面と同じ）
  var name = file.name || 'file', mime = file.type || '';
  var isHeic = /\.(heic|heif)$/i.test(name) || mime === 'image/heic' || mime === 'image/heif';
  var isImg = /^image\//.test(mime) || isHeic || /\.(jpe?g|png|gif|webp)$/i.test(name);
  if(!isImg) return { blob:file, name:name, mimeType: mime || 'application/pdf' };
  var blob = file;
  if(isHeic && typeof heic2any !== 'undefined'){ try{ var cv=await heic2any({ blob:file, toType:'image/jpeg', quality:0.85 }); blob=Array.isArray(cv)?cv[0]:cv; name=name.replace(/\.(heic|heif)$/i,'')+'.jpg'; mime='image/jpeg'; }catch(e){} }
  if(typeof imageCompression !== 'undefined'){ try{ blob=await imageCompression(blob, { maxSizeMB:1.5, maxWidthOrHeight:2400, useWebWorker:true, fileType:'image/jpeg', initialQuality:0.85 }); mime='image/jpeg'; if(!/\.(jpe?g)$/i.test(name)) name=name.replace(/\.[^.]+$/,'')+'.jpg'; }catch(e){} }
  return { blob:blob, name:name, mimeType: mime || 'image/jpeg' };
}
function toBase64(blob){ return new Promise(function(res, rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(',')[1]); }; r.onerror=function(){ rej(new Error('Read failed')); }; r.readAsDataURL(blob); }); }
function tfetch(url, opts){ if(typeof AbortController==='undefined') return fetch(url, opts); var ac=new AbortController(), tm=setTimeout(function(){ ac.abort(); }, UPL_TIMEOUT_MS); return fetch(url, Object.assign({}, opts, { signal:ac.signal })).finally(function(){ clearTimeout(tm); }); }
function errReason(err){
  var m = String((err && err.message) || err || '');
  if(navigator.onLine === false) return 'インターネットにつながっていません。電波の良い場所かWi-Fiにつないでから、もう一度送信してください。';
  if((err && err.name === 'AbortError') || /timeout/i.test(m)) return '送信に時間がかかりすぎて止まりました。Wi-Fiにつなぐか、ファイルを分けてもう一度送信してください。';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return '通信エラーで送信できませんでした。電波の良い場所で、もう一度送信してください。';
  var hs = m.match(/HTTP (\d{3})/); if(hs){ var c=+hs[1]; if(c===413) return 'ファイルが大きすぎて受け付けられませんでした。分けて送信してください。'; if(c===429 || c>=500) return 'サーバーが混み合っています。少し時間をおいて、もう一度送信してください。'; }
  if(/expired/.test(m)) return 'このURLの有効期限が過ぎています。大房行政書士法人の担当者までご連絡ください。';
  return '送信できませんでした（'+m.slice(0,80)+'）。もう一度送信しても失敗する場合は、この画面を撮って担当者へお送りください。';
}
function ymd(){ var d=new Date(); return d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2); }
async function submit(){
  if(!picked.length || !META || window._sending) return;
  window._sending = true;
  var btn=$('submitBtn'), sm=$('statusMsg'), pw=$('progressWrap'), pb=$('progressBar');
  btn.disabled = true; pw.style.display='block'; sm.style.display='block'; sm.className='status-msg';
  var who = (META.persons||[]).join('・'); if(who.length > 30) who = who.slice(0,30)+'ほか';
  var base = ('押印済み_'+(who || META.company || '')+'_'+ymd()).replace(/[\\\/:*?"<>|]/g,'');
  var ok=[], failed=[], total=picked.length;
  for(var i=0;i<total;i++){
    var p=picked[i];
    sm.textContent='('+(i+1)+'/'+total+') '+p.file.name+' を送信中…'; pb.style.width=Math.round((i/total)*90+5)+'%';
    try{
      var pf=await prepFile(p.file);
      if(pf.blob.size > UPL_MAX_FILE_MB*1024*1024) throw new Error('FILE_TOO_LARGE');
      var b64=await toBase64(pf.blob);
      var ext=(pf.name.split('.').pop()||'pdf').toLowerCase();
      var name=base+(total>1?('_'+(i+1)):'')+'.'+ext;
      var res=await tfetch(GAS_URL, { method:'POST', body: JSON.stringify({ files:[{ name:name, mimeType:pf.mimeType, data:b64 }], folderId: META.folder_id }) });
      if(!res.ok) throw new Error('HTTP '+res.status);
      var txt=await res.text(), json; try{ json=JSON.parse(txt); }catch(pe){ throw new Error('BAD_RESPONSE'); }
      if(!json.success) throw new Error(json.error || 'error');
      var rf=(Array.isArray(json.files) ? json.files[0] : null) || {};
      var url=rf.url || rf.webViewLink || rf.fileUrl || (rf.id ? ('https://drive.google.com/file/d/'+rf.id+'/view') : '');
      if(!url) throw new Error('NO_URL');
      ok.push({ i:i, name:name, url:url, size:pf.blob.size, mime:pf.mimeType });
    }catch(err){ failed.push({ name:p.file.name, reason: (String(err&&err.message)==='FILE_TOO_LARGE') ? '「'+p.file.name+'」が大きすぎます（'+UPL_MAX_FILE_MB+'MBまで）。' : errReason(err) }); }
  }
  pb.style.width='95%';
  if(ok.length){
    try{
      var r=await rpc('oshiin_upload_submit', { p_token:TOKEN, p_files: ok.map(function(o){ return { name:o.name, url:o.url, size:String(o.size), mime:o.mime }; }), p_note: $('note').value || null });
      var j=r.ok ? await r.json() : null;
      if(!j || j.error) throw new Error((j && j.error) || ('HTTP '+r.status));
      // 送れた分は選択から外す（失敗した分は残してもう一度送れるように）
      ok.slice().sort(function(a,b){ return b.i-a.i; }).forEach(function(o){ var q=picked[o.i]; if(q && q.url) URL.revokeObjectURL(q.url); picked.splice(o.i,1); });
      $('note').value='';
      var now=new Date().toISOString();
      META.files=(META.files||[]).concat(ok.map(function(o){ return { name:o.name, at:now }; })); META.uploaded_at=now; renderDone();
    }catch(e){
      failed.push({ name:'（記録）', reason:'ファイルは届きましたが、受付の記録ができませんでした（'+String(e&&e.message||e).slice(0,40)+'）。お手数ですが、大房行政書士法人の担当者へ「アップロードした」とご連絡ください。' });
      picked=[];
    }
  }
  pb.style.width='100%'; renderPicked(); window._sending=false;
  if(!failed.length){
    sm.className='status-msg success';
    sm.textContent='✅ 送信しました（'+ok.length+'件）。ありがとうございました。\n担当者が確認いたします。足りないページがあれば、追加でお送りください。';
  } else {
    sm.className='status-msg error';
    sm.textContent=(ok.length ? ('✅ '+ok.length+'件は送信できました。\n') : '')+'⚠️ 送信できなかったものがあります：\n'+failed.map(function(f){ return '■ '+f.name+'\n　→ '+f.reason; }).join('\n')+(picked.length?'\n\n残ったファイルは、もう一度［送信する］を押すと送れます。':'');
  }
  try{ sm.scrollIntoView({ behavior:'smooth', block:'center' }); }catch(e){}
  setTimeout(function(){ pw.style.display='none'; pb.style.width='0'; }, 800);
}
load();
</script>
