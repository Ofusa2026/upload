<style>
  :root {

    color: var(--sub);

  .hint { font-size: 11px; color: var(--sub); margin-top: 6px; text-align: center; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;

  .progress-wrap {

    background: #e2e8f0;
    border-radius: 99px;
    height: 8px;

async function notifyUploadToSystem(fileCount, companyId, companyName) {
  // companyId・companyName両方なくてもとりあえず送る（テーブル存在確認も兼ねる）
  try {
    const payload = {
      file_count: fileCount,
      source: 'kokko_dataup',
      created_at: new Date().toISOString()

    if (companyId) payload.company_id = companyId;
    if (companyName) payload.company_name = companyName;
    if (FOLDER_ID) payload.folder_id = FOLDER_ID;
    console.log('📤 Supabase通知送信:', payload);
    const res = await _uplRpc('upload_notify', { p_payload: payload });
    if (res.ok) {
      console.log('✅ 案件管理システムに通知しました (HTTP ' + res.status + ')');
    } else {
      const errText = await res.text();
      console.error('❌ Supabase通知エラー (HTTP ' + res.status + '):', errText);
    }
  } catch(e) {
    console.error('❌ 通知送信例外:', e);
  }
}

const DOCS_PARAM = urlParams.get('docs') || '';
function _decodeDocsParam(s){
  if(!s) return null;
  try {
    var b64 = s.replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var txt = decodeURIComponent(escape(bin));
    var arr = JSON.parse(txt);
    if(!Array.isArray(arr)) return null;
    return arr;
  } catch(e){
    console.warn('docs param decode err:', e);
    return null;
  }
}

function _loadDocsFromCache(){
  return new Promise(function(resolve){
    if(USE_NEW_DOCS){ resolve(DOCS_LIST); return; }
    if(!COMPANY_ID){ resolve(null); return; }
    _uplRpc('upload_docs_cache_get', { p_case_id: COMPANY_ID, p_kind: 'kokko' })

        resolve(DOCS_LIST);

    }).catch(function(e){
      console.warn('upload_docs_cache rpc err:', e);

    });
  });

// ─── タブ切り替え（タブUIは廃止。後方互換のためのガードのみ）───
function switchTab(tab) {
  try {
    ['large', 'normal', 'kojin'].forEach(function(t){
      var panelId = t === 'large' ? 'panelLarge' : t === 'normal' ? 'panelNormal' : 'panelKojin';
      var btnId   = t === 'large' ? 'tabBtnLarge' : t === 'normal' ? 'tabBtnNormal' : 'tabBtnKojin';
      var p = document.getElementById(panelId);
      var b = document.getElementById(btnId);
      if (p) p.classList.toggle('active', t === tab);
      if (b) b.classList.toggle('active', t === tab);
    });
  } catch(e) { /* タブUI廃止済み: 何もしない */ }
}

// ─── フィールド行を生成 ───
function buildFieldRow(key, docsMap) {
  const arr = fileData[key] || [];
  const hasFile = arr.length > 0;
  const row = document.createElement('div');
  row.className = 'field-row' + (hasFile ? ' has-file' : '');
  row.dataset.key = key;

  const header = document.createElement('div');
  header.className = 'field-header';
  header.innerHTML = `
    <span class="field-label">${_labelWithRuby(docsMap[key])}</span>
    <span class="field-status${hasFile ? ' ready' : ''}">${hasFile ? arr.length + '件選択済み ✓' : '未選択'}</span>
    <span class="chevron">▼</span>
  `;
  header.onclick = () => row.classList.toggle('open');

  const body = document.createElement('div');
  body.className = 'field-body';

  const fileListEl = document.createElement('div');
  fileListEl.className = 'file-list';
  renderFileList(key, fileListEl);
  body.appendChild(fileListEl);

  const addWrap = document.createElement('div');
  addWrap.className = 'add-btn-wrap';
  const label = document.createElement('label');
  label.className = 'add-file-label';
  label.innerHTML = '📷 ファイルを追加';
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,application/pdf';
  input.multiple = true;
  input.style.display = 'none';
  input.onchange = async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const b64 = await toBase64(file);
      if (!fileData[key]) fileData[key] = [];
      fileData[key].push({ name: file.name, mimeType: file.type || 'application/octet-stream', base64: b64 });
    }
    input.value = '';
    buildAllFields();
    updateSubmitBtn();
  };
  label.appendChild(input);
  addWrap.appendChild(label);
  body.appendChild(addWrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'JPG / PNG / PDF';
  body.appendChild(hint);

  row.appendChild(header);
  row.appendChild(body);
  if (hasFile) row.classList.add('open');
  return row;
}

function renderFileList(key, container) {
  container.innerHTML = '';
  const arr = fileData[key] || [];
  arr.forEach((d, i) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `<span class="file-item-name">📄 ${d.name}</span><button class="file-remove" title="削除">✕</button>`;
    item.querySelector('.file-remove').onclick = () => {
      fileData[key].splice(i, 1);
      buildAllFields();
      updateSubmitBtn();
    };
    container.appendChild(item);
  });
}

// ver.20260620.43: 大房側で作成する書類（エクセル一覧にない書類）。グレーアウト＋「※弊社作成」表示
const KOKKO_OFUSA_DOCS = ['6. 委任状','8. 同等の技能を有する日本人と同等額以上の報酬であることの説明書','12. 雇用契約書','15. 重要事項説明書','16. 技能者ID'];
function _kokkoIsOfusaDoc(name){ return KOKKO_OFUSA_DOCS.indexOf(name) >= 0; }

// 条件フィルタの質問定義（回答 No で該当書類を不要に）
const KOKKO_FILTERS = [
  { id:'shugyo',   q:'常勤職員は10人以上ですか？',                   targets:['9. 就業規則および賃金規程'] },
  { id:'jikangai', q:'時間外労働はありますか？',                     targets:['13. 36協定'] },
  { id:'henkei',   q:'1年単位の変形労働時間制を採用していますか？',  targets:['14. 年間カレンダー'] }
];
// 回答状態（true=はい/必要, false=いいえ/不要, undefined=未回答）
window._kokkoFilterAns = {};

function _kokkoSampleUrl(name){
  var m = KOKKO_DOC_META[name];
  if(!m || !m.sample) return '';
  return KOKKO_SAMPLE_BASE + m.sample;
}
// 書類名が条件付きで「不要」と判定されているか
function _kokkoIsSkippedByFilter(name){
  for(var i=0;i<KOKKO_FILTERS.length;i++){
    var f = KOKKO_FILTERS[i];
    if(f.targets.indexOf(name) >= 0 && window._kokkoFilterAns[f.id] === false){
      return true;
    }
  }
  return false;
}

// 条件フィルタUIを描画
function buildKokkoFilters(){
  // DOCS_LIST に条件付き書類が含まれる場合のみフィルタ表示
  var names = (DOCS_LIST||[]).map(function(d){ return d.l || ''; });
  var needFilters = KOKKO_FILTERS.filter(function(f){
    return f.targets.some(function(t){ return names.indexOf(t) >= 0; });
  });
  var box = document.getElementById('kokkoFilterBox');
  var qWrap = document.getElementById('kokkoFilterQuestions');
  if(!box || !qWrap) return;
  if(!needFilters.length){ box.style.display='none'; return; }
  box.style.display='block';
  qWrap.innerHTML = needFilters.map(function(f){
    var ans = window._kokkoFilterAns[f.id];
    function btn(val,label,color){
      var on = ans === val;
      return '<button onclick="setKokkoFilter(\''+f.id+'\','+val+')" style="flex:1;padding:7px;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;border:1.5px solid '+(on?color:'#cbd5e1')+';background:'+(on?color:'white')+';color:'+(on?'white':'#475569')+';">'+label+'</button>';
    }
    return '<div style="margin-bottom:10px;">'+
      '<div style="font-size:12px;font-weight:700;color:#0c4a6e;margin-bottom:5px;">'+f.q+'</div>'+
      '<div style="display:flex;gap:8px;">'+btn(true,'はい','#0369a1')+btn(false,'いいえ','#64748b')+'</div></div>';
  }).join('');
}
function setKokkoFilter(id, val){
  window._kokkoFilterAns[id] = val;
  buildKokkoFilters();
  buildAllFields();
}

function buildAllFields() {
  // ver.20260602.08: タブ廃止・1リスト化。DBキャッシュ(kind=kokko)の DOCS_LIST=[{l,r,done,note}] を順次描画
  const listEl = document.getElementById('fieldsList');
  if (!listEl) return;
  listEl.innerHTML = '';

  // DBキャッシュ(kind=kokko)が無い場合は旧入管書類を出さず、案内文のみ表示
  if (!USE_NEW_DOCS || !Array.isArray(DOCS_LIST) || !DOCS_LIST.length) {
    const msg = document.createElement('div');
    msg.className = 'notice-box';
    msg.style.marginBottom = '0';
    msg.innerHTML = '📄 現在アップロードできる書類が設定されていません。<br>お手数ですが担当者までお問い合わせください。';
    listEl.appendChild(msg);
    window._docLabelMap = {};
    return;
  }

  // 各書類に安定キー d0, d1, ... を割り当て
  const labelMap = {};
  DOCS_LIST.forEach(function(d, i){ labelMap['d' + i] = d.l || ''; });
  window._docLabelMap = labelMap;

  DOCS_LIST.forEach(function(d, i){
    const key = 'd' + i;
    const row = buildFieldRow(key, labelMap);
    const labelEl = row.querySelector('.field-label');
    const meta = KOKKO_DOC_META[d.l] || null;
    // 条件フィルタで不要判定された書類は done 扱い（不要表示＋スキップ）
    const filterSkipped = _kokkoIsSkippedByFilter(d.l);
    const isDone = d.done || filterSkipped;

    // ★早め収集マーク（ラベル先頭）
    if (meta && meta.slow && labelEl && labelEl.innerHTML.indexOf('★') === -1) {
      labelEl.innerHTML = '<span style="color:#d97706;font-size:13px;font-weight:800;margin-right:3px;">★</span>' + labelEl.innerHTML;
    }

    // 必須マーク
    if (d.r && labelEl && labelEl.innerHTML.indexOf('必須') === -1) {
      labelEl.innerHTML = '<span style="color:#dc2626;font-size:11px;margin-right:3px;">必須</span>' + labelEl.innerHTML;
    }

    // 取得済み/不要: 濃いめのグレーで暗く見せる
    if (isDone) {
      row.style.background = '#cbd5e1';
      row.style.borderColor = '#94a3b8';
      row.style.opacity = '0.7';
      if (labelEl) {
        const doneEl = document.createElement('span');
        doneEl.style.cssText = 'color:#16a34a;font-size:11px;font-weight:700;margin-left:4px;';
        // ver.20260620.43: st（staff=提出済み / skip=不要 / ofusa=弊社作成）で表示を分ける
        var _st = d.st || '';
        if (_st === 'ofusa' || _kokkoIsOfusaDoc(d.l)) {
          doneEl.textContent = '※弊社作成（ご提出は不要です）';
          doneEl.style.color = '#7c3aed';
        } else if (filterSkipped || _st === 'skip') {
          doneEl.textContent = '― 不要';
          doneEl.style.color = '#64748b';
        } else {
          doneEl.textContent = '✓ 提出済み（再提出が必要な場合のみ）';
        }
        labelEl.appendChild(doneEl);
      }
    }

    // ★早め収集の注意（ラベル下）
    if (meta && meta.slow && labelEl) {
      const slowEl = document.createElement('div');
      slowEl.style.cssText = 'font-size:11px;color:#b45309;font-weight:700;margin-top:4px;line-height:1.6;';
      slowEl.textContent = '★ 取得にお時間がかかる書類です。お早めのご準備にご協力ください。';
      labelEl.appendChild(slowEl);
    }

    // 説明文（エクセル由来）＋発行場所
    if (meta && meta.desc && labelEl) {
      const descEl = document.createElement('div');
      descEl.style.cssText = 'font-size:11px;color:#475569;font-weight:400;margin-top:5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;';
      var _t = meta.desc;
      if (meta.place) _t += '\n【取得先】' + meta.place;
      // HTMLエスケープしてからURLを<a>に変換（XSS対策・URLはクリックで開ける）
      var _esc = _t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      var _linked = _esc.replace(/(https?:\/\/[^\s　、）)」]+)/g, function(u){
        return '<a href="'+u+'" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;font-weight:600;">'+u+'</a>';
      });
      descEl.innerHTML = _linked;
      labelEl.appendChild(descEl);
    }

    // 見本画像（折りたたみ）
    if (meta && meta.sample && labelEl) {
      const url = _kokkoSampleUrl(d.l);
      const sampleWrap = document.createElement('div');
      sampleWrap.style.cssText = 'margin-top:6px;';
      sampleWrap.innerHTML = '<details style="font-size:11px;"><summary style="cursor:pointer;color:#2563eb;font-weight:700;">🖼️ 見本を見る</summary>'+
        '<div style="margin-top:6px;text-align:center;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:6px;">'+
        '<img src="'+url+'" alt="見本" loading="lazy" style="max-width:100%;max-height:320px;object-fit:contain;border-radius:4px;"></div></details>';
      labelEl.appendChild(sampleWrap);
    }

    // ラベル下に注意書き 💡 + note
    if (d.note && labelEl) {
      const noteEl = document.createElement('div');
      noteEl.style.cssText = 'font-size:11px;color:#b45309;font-weight:400;margin-top:4px;line-height:1.6;';
      noteEl.textContent = '💡 ' + d.note;
      labelEl.appendChild(noteEl);
    }

    listEl.appendChild(row);
  });
  // 条件フィルタUIも（再）描画
  if(typeof buildKokkoFilters==='function') buildKokkoFilters();
}

function updateSubmitBtn() {
  // ver.20260602.08: 新ロジック(DBキャッシュ)の window._docLabelMap で判定
  var allKeys = (USE_NEW_DOCS && window._docLabelMap) ? Object.keys(window._docLabelMap) : [];
  var hasAny = allKeys.some(function(k){ return fileData[k] && fileData[k].length > 0; });
  var btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = !hasAny;
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = () => reject(new Error('Read failed'));
    r.readAsDataURL(file);
  });
}

// ver.20260525.34: DBキャッシュから書類リストを取得してから初期描画
(async function _initDocsAndBuild(){
  try { await _loadDocsFromCache(); } catch(e){ console.warn('_initDocsAndBuild err:', e); }
  buildAllFields();
})();

document.getElementById('submitBtn').addEventListener('click', async () => {
  // ver.20260525.01: 新ロジックでは window._docLabelMap、旧ロジックでは LARGE/NORMAL/KOJIN_DOCS を結合
  let allKeys, allDocs;
  if (USE_NEW_DOCS && window._docLabelMap) {
    allKeys = Object.keys(window._docLabelMap);
    allDocs = window._docLabelMap;
  } else {
    allKeys = [...LARGE_KEYS, ...NORMAL_KEYS, ...KOJIN_KEYS];
    allDocs = { ...LARGE_DOCS, ...NORMAL_DOCS, ...KOJIN_DOCS };
  }
  const hasAny = allKeys.some(k => fileData[k] && fileData[k].length > 0);
  if (!hasAny) { alert('少なくとも1つのファイルを選択してください'); return; }

  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');

  submitBtn.disabled = true;
  statusMsg.style.display = 'none';
  progressWrap.style.display = 'block';
  progressBar.style.width = '10%';

  const timestamp = Date.now();
  const filesPayload = [];
  allKeys.forEach(key => {
    const arr = fileData[key] || [];
    arr.forEach((d, i) => {
      const ext = d.name.split('.').pop() || 'jpg';
      const suffix = arr.length > 1 ? '_' + (i + 1) : '';
      filesPayload.push({
        name: allDocs[key] + suffix + '.' + ext,
        docLabel: allDocs[key],
        mimeType: d.mimeType,
        data: d.base64,
      });
    });
  });

  try {
    progressBar.style.width = '40%';
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ files: filesPayload, folderId: FOLDER_ID }),
    });
    progressBar.style.width = '90%';
    const json = await res.json();
    if (json.success) {
      progressBar.style.width = '100%';
      statusMsg.className = 'status-msg success';
      statusMsg.textContent = '✅ アップロード完了しました！\n担当者に届きました。';
      statusMsg.style.display = 'block';
      // 案件管理システムにアップロード通知
      notifyUploadToSystem(filesPayload.length, COMPANY_ID, COMPANY_NAME);
      // ver.20260903.34: 入管(company_dataup)と同様、書類ごとにドライブURLを upload_notifications へ保存
      //   （案シスの書類プレビューはこの upload_notifications.drive_url を読むため、これが無いと国交省アップロードがプレビューされなかった）
      try {
        var _resFiles = Array.isArray(json.files) ? json.files : [];
        for (var _fi = 0; _fi < filesPayload.length; _fi++) {
          var _rf = _resFiles[_fi] || {};
          var _durl = _rf.url || _rf.webViewLink || _rf.fileUrl || (_rf.id ? ('https://drive.google.com/file/d/' + _rf.id + '/view') : '');
          if (!_durl) continue;
          _uplRpc('upload_notify', { p_payload: {
            company_id: COMPANY_ID,
            company_name: COMPANY_NAME,
            folder_id: FOLDER_ID,
            file_count: 1,
            file_names: filesPayload[_fi].name,
            doc_label: filesPayload[_fi].docLabel,
            drive_url: _durl,
            source: 'kokko_dataup'
          } });
        }
      } catch (e) { console.warn('URL通知保存失敗:', e); }
      allKeys.forEach(k => delete fileData[k]);
      buildAllFields();
      updateSubmitBtn();
    } else {
      throw new Error(json.error || 'error');
    }
  } catch (err) {
    statusMsg.className = 'status-msg error';
    statusMsg.textContent = '❌ 送信に失敗しました。\nもう一度お試しください。';
    statusMsg.style.display = 'block';
    submitBtn.disabled = false;
  }

  setTimeout(() => {
    progressWrap.style.display = 'none';
    progressBar.style.width = '0%';
  }, 1200);
});
</script>
