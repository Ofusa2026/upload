<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&family=Noto+Sans:wght@400;600&display=swap');
  :root{--primary:#1a56db;--primary-dark:#1341a8;--success:#057a55;--success-bg:#f0fdf4;--success-border:#bbf7d0;--error:#9b1c1c;--error-bg:#fef2f2;--error-border:#fecaca;--bg:#f0f4f8;--card:#ffffff;--text:#1a202c;--sub:#718096;--border:#e2e8f0;--hover:#eff6ff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans','Noto Sans JP',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px 60px;}
  .card{background:var(--card);border-radius:20px;padding:28px 20px;max-width:480px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
  .lang-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;justify-content:center;}
  .lang-btn{padding:5px 10px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;background:#fff;color:var(--sub);transition:all 0.15s;font-family:inherit;}
  .lang-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
  .header{text-align:center;margin-bottom:28px;}
  .office-name{font-size:12px;color:var(--sub);margin-bottom:8px;}
  .page-icon{font-size:36px;margin-bottom:8px;}
  h1{font-size:20px;font-weight:600;color:var(--text);margin-bottom:6px;}
  .subtitle{font-size:13px;color:var(--sub);line-height:1.7;white-space:pre-line;}
  .fields-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
  .field-row{border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color 0.2s;}
  .field-row.has-file{border-color:var(--primary);background:#eff6ff;}
  .field-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none;gap:8px;}
  .field-label{font-size:14px;font-weight:600;color:var(--text);flex:1;}
  .field-status{font-size:12px;color:var(--sub);white-space:nowrap;}
  .field-status.ready{color:var(--success);font-weight:600;}
  .chevron{font-size:11px;color:var(--sub);transition:transform 0.2s;flex-shrink:0;}
  .field-row.open .chevron{transform:rotate(180deg);}
  .field-body{border-top:1.5px solid var(--border);padding:12px 14px;display:none;}
  .field-row.open .field-body{display:block;}
  .field-row.has-file .field-body{border-top-color:var(--primary);}
  .mini-drop{border:2px dashed #c0cfe0;border-radius:10px;padding:20px 12px;text-align:center;cursor:pointer;position:relative;background:#f8fafc;transition:all 0.2s;}
  .mini-drop:hover{border-color:var(--primary);background:var(--hover);}
  .mini-drop input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .mini-drop-text{font-size:13px;color:#4a5568;font-weight:600;}
  .mini-drop-hint{font-size:11px;color:#a0aec0;margin-top:3px;}
  .preview-wrap{position:relative;display:block;}
  .preview-wrap img{width:100%;max-height:180px;object-fit:contain;border-radius:8px;background:#eee;display:block;}
  .remove-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.65);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .btn-submit{display:block;width:100%;padding:16px;background:var(--primary);color:#fff;font-family:inherit;font-size:16px;font-weight:600;border:none;border-radius:12px;cursor:pointer;transition:background 0.2s;}
  .btn-submit:hover:not(:disabled){background:var(--primary-dark);}
  .btn-submit:disabled{background:#93c5fd;cursor:not-allowed;}
  .progress-bar-wrap{display:none;margin-top:14px;background:#e2e8f0;border-radius:8px;overflow:hidden;height:8px;}
  .progress-bar{height:100%;background:var(--primary);width:0%;transition:width 0.4s;}
  .status-msg{display:none;margin-top:18px;padding:16px;border-radius:12px;font-size:14px;text-align:center;line-height:1.7;white-space:pre-line;}
  .status-msg.success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
  .status-msg.error{background:var(--error-bg);color:var(--error);border:1px solid var(--error-border);}
  /* 名前確認モーダル */
  .name-confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;}
  .name-confirm-modal{background:#fff;border-radius:16px;width:100%;max-width:420px;padding:24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .name-confirm-modal .nc-title{font-size:16px;font-weight:800;color:#0f2040;text-align:center;margin-bottom:6px;}
  .name-confirm-modal .nc-subtitle{font-size:12px;color:#64748b;text-align:center;margin-bottom:18px;}
  .name-confirm-modal .nc-name-box{background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);border:2px solid #2563eb;border-radius:12px;padding:18px 14px;margin-bottom:16px;text-align:center;}
  .name-confirm-modal .nc-name-box .nc-label{font-size:11px;color:#2563eb;font-weight:700;margin-bottom:6px;letter-spacing:.5px;}
  .name-confirm-modal .nc-name-box .nc-name{font-size:24px;font-weight:800;color:#1e3a8a;letter-spacing:.3px;word-break:break-word;line-height:1.3;}
  .name-confirm-modal .nc-warn{font-size:11px;color:#92400e;background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:10px 12px;margin-bottom:16px;line-height:1.5;}
  .name-confirm-modal .nc-buttons{display:flex;flex-direction:column;gap:8px;}
  .name-confirm-modal .nc-btn-yes{padding:14px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
  .name-confirm-modal .nc-btn-yes:active{background:#15803d;transform:scale(.98);}
  .name-confirm-modal .nc-btn-no{padding:12px;background:#fff;color:#dc2626;border:2px solid #fca5a5;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .name-confirm-modal .nc-btn-no:active{background:#fef2f2;}
  /* 名前バナー（確認後・常時表示） */
  .name-banner{background:#eff6ff;border-radius:10px;padding:12px 14px;margin-bottom:20px;border:1px solid #bfdbfe;text-align:left;}
  .name-banner .nb-name{display:block;font-size:18px;font-weight:800;color:#1e3a8a;margin-bottom:2px;letter-spacing:.3px;word-break:break-word;}
  .name-banner .nb-desc{display:block;font-size:11px;color:#2563eb;}
</style>
</head>

<script>
const VERSION = 'ver.20260514.01';

// 不要書類リスト（index.htmlのskipフラグから渡される）
const SKIP_DOCS_RAW = urlParams.get('skipDocs') || '';
const SKIP_DOCS = SKIP_DOCS_RAW ? decodeURIComponent(SKIP_DOCS_RAW).split(',').map(s => s.trim()).filter(Boolean) : [];

const ALL_DOCS = [

  {key:'zairyu_back',tags:['在留カード']},
  {key:'passport',tags:['パスポート']},

  {key:'embassy_rec',tags:['大使館推薦票']},
  {key:'other',tags:[]},
];
const REQUIRED_RULES = {

};

};
function isDocSkipped(doc) {
  if (!SKIP_DOCS.length || !doc.tags.length) return false;
  return doc.tags.some(tag => SKIP_DOCS.some(s => s.indexOf(tag) >= 0 || tag.indexOf(s) >= 0));
}
function getDocPattern() {
  const at = APP_TYPE;
  if (at === '更新') return {zairyu_front:'required',zairyu_back:'required',passport:'required',cert_jp:'optional',cert_skill:'optional',cert_specialist:'hidden',tax_cert:'required',tax_payment:'required',withholding:'required',medical:'required',mugshot:'required',health_ins:'hidden',health_ins_cert:'hidden',graduation:'hidden',transcript:'hidden',nenkin:'hidden',embassy_rec:'optional',other:'optional'};

  if (at === '認定') return {zairyu_front:'hidden',zairyu_back:'hidden',passport:'required',cert_jp:'required',cert_skill:'required',cert_specialist:'optional',tax_cert:'hidden',tax_payment:'hidden',withholding:'hidden',medical:'required',mugshot:'required',health_ins:IS_RYUGAKU?'required':'hidden',health_ins_cert:IS_RYUGAKU?'required':'hidden',graduation:IS_RYUGAKU?'required':'hidden',transcript:IS_RYUGAKU?'required':'hidden',nenkin:IS_RYUGAKU?'required':'hidden',embassy_rec:'optional',other:'optional'};
  return Object.fromEntries(ALL_DOCS.map(d => [d.key,'optional']));
}
function getRequiredTags() {
  if (!APP_TYPE) return null;
  return (REQUIRED_RULES[APP_TYPE]||[]).concat(IS_RYUGAKU?(RYUGAKU_RULES[APP_TYPE]||[]):[]);
}
function getDocKeys() {
  const required = getRequiredTags();
  const pattern = APP_TYPE ? getDocPattern() : null;
  if (!required) return ALL_DOCS.filter(doc => !isDocSkipped(doc)).map(d => d.key);
  return ALL_DOCS.filter(doc => {
    if (doc.key === 'other') return true;
    if (!doc.tags.length) return false;
    if (isDocSkipped(doc)) return false;
    // patternでoptionalのものも表示
    if (pattern && pattern[doc.key] === 'optional') return true;
    // hiddenは除外
    if (pattern && pattern[doc.key] === 'hidden') return false;
    return doc.tags.some(tag => required.some(r => r.indexOf(tag) >= 0 || tag.indexOf(r) >= 0));
  }).map(d => d.key);
}
let DOC_KEYS = getDocKeys();

      am.appendChild(ai); am.appendChild(at2); body.appendChild(am);
    } else {
      const mini = document.createElement('div'); mini.className='mini-drop';
      const input = document.createElement('input'); input.type='file'; input.accept='image/*,image/heic,image/heif,application/pdf'; input.multiple=true;
      input.addEventListener('change', e => { const files=Array.from(e.target.files); if(!files.length) return; if(!fileData[key]) fileData[key]=[]; let loaded=0; files.forEach(file => { const r=new FileReader(); r.onload=ev => { fileData[key].push({dataUrl:ev.target.result,name:file.name,mimeType:file.type,base64:ev.target.result.split(',')[1],isPdf:file.type==='application/pdf'}); loaded++; if(loaded===files.length){ buildFields(); updateSubmitBtn(); const idx=DOC_KEYS.indexOf(key); const nk=DOC_KEYS.slice(idx+1).find(k=>!fileData[k]||!fileData[k].length); if(nk){const nr=fieldsList.querySelector('[data-key="'+nk+'"]');if(nr)nr.classList.add('open');} } }; r.readAsDataURL(file); }); e.target.value=''; });
      const dt = document.createElement('div'); dt.className='mini-drop-text'; dt.textContent=L.tapToAdd;
      const dh = document.createElement('div'); dh.className='mini-drop-hint'; dh.textContent=L.hint;

// ============================================================
// 画像前処理：HEIC → JPEG変換 + 圧縮
// ============================================================
async function preprocessFile(fileBlob, fileName, mimeType) {
  // PDFはそのまま返す
  if (mimeType === 'application/pdf' || /\.pdf$/i.test(fileName)) {
    return { blob: fileBlob, name: fileName, mimeType: 'application/pdf' };
  }
  
  let workBlob = fileBlob;
  let workName = fileName;
  let workMime = mimeType || 'image/jpeg';
  
  // HEIC/HEIF判定（拡張子 or MIME or 両方）
  const isHeic = /\.(heic|heif)$/i.test(fileName) || 
                 mimeType === 'image/heic' || 
                 mimeType === 'image/heif' ||
                 mimeType === '';
  
  // HEIC → JPEG変換
  if (isHeic && typeof heic2any !== 'undefined') {
    try {
      const converted = await heic2any({ blob: fileBlob, toType: 'image/jpeg', quality: 0.85 });
      workBlob = Array.isArray(converted) ? converted[0] : converted;
      workName = fileName.replace(/\.(heic|heif)$/i, '.jpg');
      if (!/\.(jpg|jpeg)$/i.test(workName)) workName += '.jpg';
      workMime = 'image/jpeg';
      console.log('HEIC変換成功:', fileName, '→', workName);
    } catch (e) {
      console.warn('HEIC変換失敗（そのまま続行）:', fileName, e);
    }
  }
  
  // 画像圧縮（image系のみ）
  if (workMime.startsWith('image/') && typeof imageCompression !== 'undefined') {
    try {
      const compressed = await imageCompression(workBlob, {
        maxSizeMB: 1.5,
        maxWidthOrHeight: 2000,
        useWebWorker: true,
        fileType: 'image/jpeg',
        initialQuality: 0.8
      });
      workBlob = compressed;
      workMime = 'image/jpeg';
      if (!/\.(jpg|jpeg)$/i.test(workName)) {
        workName = workName.replace(/\.[^.]+$/, '') + '.jpg';
      }
      console.log('圧縮成功:', fileName, '→', (compressed.size/1024).toFixed(0) + 'KB');
    } catch (e) {
      console.warn('圧縮失敗（元ファイルで続行）:', fileName, e);
    }
  }
  
  return { blob: workBlob, name: workName, mimeType: workMime };
}

// Blob → base64
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

// dataURL → Blob（既存fileDataがdataUrl形式のため）
function dataUrlToBlob(dataUrl, mimeType) {
  const arr = dataUrl.split(',');
  const bstr = atob(arr[1]);
  const u8 = new Uint8Array(bstr.length);
  for (let i = 0; i < bstr.length; i++) u8[i] = bstr.charCodeAt(i);
  return new Blob([u8], { type: mimeType || 'application/octet-stream' });
}

// ============================================================
// 1ファイルずつ送信（直列処理）
// ============================================================
async function uploadOneFile(payload) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    redirect: 'follow',
    body: JSON.stringify({ files: [payload], folderId: FOLDER_ID })
  });
  let json = { success: true };
  try {
    const text = await res.text();
    if (text && text.trim().startsWith('{')) json = JSON.parse(text);
  } catch (e) {}
  if (!json.success) throw new Error(json.error || 'upload failed');
  return json;
}

submitBtn.addEventListener('click', async () => {
  const L = LANGS[currentLang];
  const keys = Object.keys(fileData).filter(k => fileData[k] && fileData[k].length > 0);
  if (!keys.length) { alert(L.msgNoFile); return; }
  
  submitBtn.disabled = true;
  progressWrap.style.display = 'block';
  progressBar.style.width = '2%';
  statusMsg.style.display = 'none';
  
  // 全ファイルをフラットにペイロード化（前処理前）
  const allFiles = [];
  keys.forEach(key => {
    const arr = fileData[key] || [];
    const docLabel = LANGS['ja'].docs[key] || key;
    arr.forEach((d, i) => {
      const ext = (d.name.split('.').pop() || 'jpg').toLowerCase();
      const sfx = arr.length > 1 ? '_' + (i + 1) : '';
      allFiles.push({
        key: key,
        idx: i,
        docLabel: docLabel,
        originalName: d.name,
        ext: ext,
        dataUrl: d.dataUrl,
        mimeType: d.mimeType,
        isPdf: d.isPdf
      });
    });
  });
  
  const total = allFiles.length;
  const failed = [];
  const successKeys = []; // 成功した {key, idx} を記録
  
  // ステータス表示要素
  statusMsg.style.display = 'block';
  statusMsg.className = 'status-msg';
  statusMsg.style.background = '#eff6ff';
  statusMsg.style.color = '#1e40af';
  statusMsg.style.border = '1px solid #bfdbfe';
  
  for (let i = 0; i < allFiles.length; i++) {
    const f = allFiles[i];
    const stepLabel = '(' + (i + 1) + '/' + total + ')';
    
    try {
      // ステップ1: 前処理表示
      statusMsg.textContent = stepLabel + ' ' + f.docLabel + ' を準備中…';
      progressBar.style.width = Math.round((i / total) * 90 + 2) + '%';
      
      // dataUrl → Blob → 前処理
      const srcBlob = dataUrlToBlob(f.dataUrl, f.mimeType);
      const processed = await preprocessFile(srcBlob, f.originalName, f.mimeType);
      const base64 = await blobToBase64(processed.blob);
      
      // ファイル名生成（書類名_連番.拡張子）
      const arrLen = (fileData[f.key] || []).length;
      const newExt = processed.name.split('.').pop() || 'jpg';
      const sfx = arrLen > 1 ? '_' + (f.idx + 1) : '';
      const finalName = f.docLabel + sfx + '.' + newExt;
      
      const payload = {
        name: finalName,
        mimeType: processed.mimeType,
        data: base64
      };
      
      // ステップ2: 送信表示
      statusMsg.textContent = stepLabel + ' ' + f.docLabel + ' を送信中…';
      progressBar.style.width = Math.round(((i + 0.5) / total) * 90 + 2) + '%';
      
      await uploadOneFile(payload);
      
      // Supabase通知（1ファイルごと）
      if (CASE_ID) {
        try {
          await fetch('https://ehwlgbwpycglmopiqyty.supabase.co/rest/v1/upload_notifications', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': 'sb_publishable_3ptyILIpGIcNA5sUBhFMbA_n0VxpY2u',
              'Authorization': 'Bearer sb_publishable_3ptyILIpGIcNA5sUBhFMbA_n0VxpY2u',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
              case_id: CASE_ID,
              folder_id: FOLDER_ID,
              file_count: 1,
              file_names: finalName
            })
          });
        } catch (e) { console.warn('通知保存失敗:', e); }
      }
      
      successKeys.push({ key: f.key, idx: f.idx });
      progressBar.style.width = Math.round(((i + 1) / total) * 90 + 2) + '%';
      
    } catch (err) {
      console.error('アップロード失敗:', f.docLabel, err);
      failed.push({ docLabel: f.docLabel, error: err.message || 'error' });
    }
  }
  
  // 成功したファイルだけ fileData から削除（失敗したのは残してリトライ可能に）
  // 後ろから消さないとidxがずれる
  const successByKey = {};
  successKeys.forEach(s => {
    if (!successByKey[s.key]) successByKey[s.key] = [];
    successByKey[s.key].push(s.idx);
  });
  Object.keys(successByKey).forEach(key => {
    const indices = successByKey[key].sort((a, b) => b - a);
    indices.forEach(idx => {
      if (fileData[key]) fileData[key].splice(idx, 1);
    });
    if (fileData[key] && fileData[key].length === 0) delete fileData[key];
  });
  
  // 結果表示
  progressBar.style.width = '100%';
  statusMsg.style.background = '';
  statusMsg.style.color = '';
  statusMsg.style.border = '';
  
  if (failed.length === 0) {
    statusMsg.className = 'status-msg success';
    statusMsg.textContent = L.msgSuccess;
  } else if (failed.length === total) {
    statusMsg.className = 'status-msg error';
    statusMsg.textContent = L.msgError + '\n失敗：' + failed.map(f => f.docLabel).join('、');
    submitBtn.disabled = false;
  } else {
    // 一部成功
    statusMsg.className = 'status-msg error';
    const successCount = total - failed.length;
    statusMsg.textContent = '✅ ' + successCount + '件 送信完了\n❌ ' + failed.length + '件 失敗：' + failed.map(f => f.docLabel).join('、') + '\nもう一度「' + L.btnSubmit + '」を押してください。';
    submitBtn.disabled = false;
  }
  
  buildFields();
  updateSubmitBtn();
  setTimeout(() => { progressWrap.style.display = 'none'; progressBar.style.width = '0%'; }, 1500);
});
